name: Recover SFDX client ID

on:
  workflow_dispatch:

permissions: {}

jobs:
  recover_client_id:
    runs-on: SFDO-Tooling-Ubuntu
    steps:
      - name: Access SFDX client ID
        shell: bash
        env:
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
        run: |
          set +x
          set -euo pipefail

          if [[ -z "$SFDX_CLIENT_ID" ]]; then
            echo "::error::SFDX_CLIENT_ID is empty or unavailable."
            exit 1
          fi

          printf '%s\n' "$SFDX_CLIENT_ID"
